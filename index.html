<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ironwood Co.</title>

<style>
:root{
  --accent:#8b5a2b;
}

/* BASE */
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
  color:#f5f5f5;
  background:
    linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)),
    url('https://images.unsplash.com/photo-1519710164239-da123dc03ef4?q=80&w=1600');
  background-size:cover;
  background-attachment:fixed;
}

/* HERO */
.hero{
  text-align:center;
  padding:80px 20px 40px;
}

.hero img{
  max-width:280px;
}

.hero h1{
  letter-spacing:4px;
  font-weight:300;
  margin:20px 0 10px;
}

.hero p{
  color:#bbb;
}

/* CAROUSEL */
.carousel{
  max-width:900px;
  margin:40px auto;
  position:relative;
}

.carousel img{
  width:100%;
  height:500px;
  object-fit:cover;
  border-radius:10px;
}

/* NAV BUTTONS */
.nav-btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(0,0,0,0.6);
  border:none;
  color:#fff;
  font-size:24px;
  padding:10px 15px;
  cursor:pointer;
}

.prev{left:10px}
.next{right:10px}

/* CONTACT */
.contact{
  text-align:center;
  padding:60px 20px;
}

.contact h2{
  font-weight:300;
}

.contact a{
  display:block;
  margin-top:10px;
  color:var(--accent);
  text-decoration:none;
}

/* FOOTER */
.footer{
  text-align:center;
  padding:30px;
  color:#888;
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
  <img src="logo.png">
  <h1>IRONWOOD CO.</h1>
  <p>Handcrafted wood & metal pieces</p>
</div>

<!-- CAROUSEL -->
<div class="carousel">
  <button class="nav-btn prev" onclick="move(-1)">‹</button>
  <img id="slide" src="images/p1.jpg">
  <button class="nav-btn next" onclick="move(1)">›</button>
</div>

<!-- CONTACT -->
<div class="contact">
  <h2>Contact</h2>
  <a href="mailto:info@ironwoodco.com">info@ironwoodco.com</a>
  <a href="#">Instagram (add link)</a>
</div>

<div class="footer">
  © Ironwood Co.
</div>

<script>
const images = [
  "images/p1.jpg",
  "images/p2.jpg",
  "images/p3.jpg",
  "images/p4.jpg",
  "images/p5.jpg",
  "images/p6.jpg",
  "images/p7.jpg",
  "images/p8.jpg",
  "images/p9.jpg"
];

let index = 0;

function move(dir){
  index += dir;
  if(index < 0) index = images.length - 1;
  if(index >= images.length) index = 0;
  document.getElementById("slide").src = images[index];
}

/* AUTO ROTATE */
setInterval(()=>move(1), 4000);
</script>

</body>
</html>

<div class="gallery">
  <img src="p1.jpg">
  <img src="p2.jpg">
  <img src="p3.jpg">
  <img src="p4.jpg">
  <img src="p5.jpg">
  <img src="p6.jpg">
  <img src="p7.jpg">
  <img src="p8.jpg">
  <img src="p9.jpg">
</div>

<div class="footer">
  © Ironwood Co.
</div>

</body>
</html>
